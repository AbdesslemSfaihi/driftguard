[project]
name = "tinybank"
version = "1.0.0"
description = "A deliberately small banking library, the subject of the DriftGuard demo"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
